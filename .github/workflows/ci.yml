name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets
      - run: cargo fmt --all
      - name: Commit fixes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: apply clippy and fmt fixes"
            git push
          fi

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: axum_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d axum_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/axum_test
      REDIS_URL: redis://localhost:6379/
      JWT_SECRET: ci-only-secret-longer-than-thirty-two-bytes
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/axum_test
      TEST_REDIS_URL: redis://localhost:6379/
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo run -- migrate
      - run: cargo install sqlx-cli --version 0.9.0 --locked
      - run: cargo sqlx prepare --check --workspace -- --all-targets
        env:
          SQLX_OFFLINE: 'false'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace -- --ignored

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      # SQLite is enabled only for in-memory scheduler tests. SQLx 0.9 pins
      # libsqlite3-sys below the fixed 0.39 release; production uses PostgreSQL.
      - run: cargo audit --ignore RUSTSEC-2026-0459
      - run: cargo install cargo-deny --locked
      - run: cargo deny check advisories
